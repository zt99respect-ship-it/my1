name: 24/7 Master Broadcast

on:
  schedule:
    # يعمل تلقائياً كل 5 ساعات لتفادي إيقاف GitHub الإجباري (الذي يحدث كل 6 ساعات)
    - cron: '0 */5 * * *'
  workflow_dispatch:
    inputs:
      kick_channel:
        description: 'Kick Channel Name'
        required: true
        default: 'W1pey'
      youtube_key:
        description: 'YouTube Stream Key'
        required: true
        default: ''
      restream_key:
        description: 'Restream Key'
        required: false
        default: 're_12215822_event12d2d60d5f814c68b3c0f0137cacab10'
      destination:
        description: 'Stream Destination (youtube, restream, both)'
        required: true
        default: 'both'
      quality:
        description: 'Stream Quality'
        required: true
        default: '1080p60,1080p,best'

# هذا القسم يضمن أنه عند عمل تحديث للجلسة، يتم إغلاق القديمة بسلاسة وتبدأ الجديدة فوراً ليبقى البث 24/7
concurrency:
  group: broadcast-24-7
  cancel-in-progress: true

jobs:
  broadcaster:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # السماح للجلسة بالعمل لأقصى مدة ممكنة
    steps:
      - name: جلب ملفات المستودع
        uses: actions/checkout@v3

      - name: تثبيت FFmpeg و Streamlink
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip fonts-kacst
          sudo pip3 install --upgrade streamlink

      - name: تشغيل النظام (البث أو شاشة الانتظار)
        env:
          # استخدام القيم الافتراضية إذا كان التشغيل تلقائي (عبر الـ cron)
          KICK_CHANNEL: ${{ github.event.inputs.kick_channel || 'W1pey' }}
          YOUTUBE_KEY: ${{ github.event.inputs.youtube_key || '' }}
          RESTREAM_KEY: ${{ github.event.inputs.restream_key || 're_12215822_event12d2d60d5f814c68b3c0f0137cacab10' }}
          STREAM_DEST: ${{ github.event.inputs.destination || 'both' }}
          STREAM_QUALITY: ${{ github.event.inputs.quality || '1080p60,1080p,best' }}
        run: |
          chmod +x stream.sh
          ./stream.sh
