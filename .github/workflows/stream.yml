name: Continuous Kick Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  run-restream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run Restream Script
        run: python main.py
