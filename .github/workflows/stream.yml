name: Kick Auto Restreamer

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *' # فحص احتياطي كل 30 دقيقة للتشغيل في حال التوقف

permissions:
  actions: write
  contents: read

concurrency:
  group: kick-restream-group
  cancel-in-progress: false

jobs:
  start-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # إنهاء الجلسة بعد 5 ساعات و30 دقيقة لإعادة التشغيل النظيف

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run Restream Script
        run: python main.py

      - name: Auto Restart Workflow
        if: always() # يشتغل دائماً سواء نجح السكريبت أو توقف أو انتهى الوقت
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[*] إعادة تشغيل الـ Workflow تلقائياً لضمان الاستمرارية..."
          gh workflow run stream.yml
